name: Add or update your profile
description: Your card on the People page. Submitting opens a pull request with your profile.
title: "Profile: "
labels: [profile]
body:
  - type: input
    id: name
    attributes:
      label: Name
      placeholder: Jane Doe
    validations:
      required: true
  - type: input
    id: shortname
    attributes:
      label: Short name
      description: File name of your profile, lowercase letters, digits and dashes. Defaults to your last name.
      placeholder: doe
  - type: input
    id: institution
    attributes:
      label: Institution
    validations:
      required: true
  - type: input
    id: role
    attributes:
      label: Role
      description: One line, shown under your name.
      placeholder: Calorimeter reconstruction
  - type: textarea
    id: photo
    attributes:
      label: Photo
      description: Drag an image here. It is cropped to a square around the center.
  - type: input
    id: github
    attributes:
      label: GitHub username
      description: Defaults to the account submitting this form.
  - type: input
    id: email
    attributes:
      label: Email
  - type: input
    id: orcid
    attributes:
      label: ORCID
      placeholder: 0000-0002-1825-0097
  - type: input
    id: website
    attributes:
      label: Website
  - type: textarea
    id: subsystems
    attributes:
      label: Detector subsystem roles
      description: One per line, e.g. "Luminosity DSTC (Pair Spectrometer)".
  - type: textarea
    id: about
    attributes:
      label: About
      description: A paragraph about what you work on. Markdown works.
  - type: markdown
    attributes:
      value: The questions below are optional. Each answer goes on your page under the question.
  - type: textarea
    id: question-work
    attributes:
      label: What are you working on in ePIC right now?
  - type: textarea
    id: question-path
    attributes:
      label: How did you end up in nuclear physics?
  - type: textarea
    id: question-advice
    attributes:
      label: What would you tell someone starting with ePIC software?
