name: Add or update your profile
description: Your card on the People page. Submitting opens a pull request with your profile.
title: "Profile: "
labels: [profile]
body:
  - type: markdown
    attributes:
      value: |
        Fill this in for yourself only: the profile is linked to the GitHub account that submits it.
        Empty fields keep your current values, or for a new profile come from your GitHub profile (name, company, avatar, bio), so an empty form is fine. To remove something, edit your profile file instead.
  - type: input
    id: name
    attributes:
      label: Name (optional)
      placeholder: Jane Doe
  - type: input
    id: institution
    attributes:
      label: Institution (optional)
  - type: input
    id: role
    attributes:
      label: Role (optional)
      description: One line, shown under your name.
      placeholder: Calorimeter reconstruction
  - type: upload
    id: photo
    attributes:
      label: Photo (optional)
      description: Cropped to a square around the center. Defaults to your GitHub avatar.
    validations:
      accept: ".jpg,.jpeg,.png,.webp"
  - type: textarea
    id: about
    attributes:
      label: About (optional)
      description: Answer any of the questions below each one, or replace them with your own text. Unanswered questions are dropped.
      value: |
        **What are you working on in ePIC right now?**

        **How did you end up in nuclear physics?**

        **What would you tell someone starting with ePIC software?**
