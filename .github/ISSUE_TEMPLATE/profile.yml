name: Add or update your profile
description: Your card on the People page. Submitting opens a pull request with your profile.
title: "Profile: "
labels: [profile]
body:
  - type: markdown
    attributes:
      value: Fields left empty are taken from your GitHub profile (name, company, avatar, bio). Submitting an empty form is fine.
  - type: input
    id: name
    attributes:
      label: Name
      placeholder: Jane Doe
  - type: input
    id: institution
    attributes:
      label: Institution
  - type: input
    id: role
    attributes:
      label: Role
      description: One line, shown under your name.
      placeholder: Calorimeter reconstruction
  - type: textarea
    id: photo
    attributes:
      label: Photo
      description: Drag an image here. It is cropped to a square around the center. Defaults to your GitHub avatar.
  - type: textarea
    id: about
    attributes:
      label: About
      description: Answer any of the questions below each one, or replace them with your own text. Unanswered questions are dropped.
      value: |
        **What are you working on in ePIC right now?**

        **How did you end up in nuclear physics?**

        **What would you tell someone starting with ePIC software?**
